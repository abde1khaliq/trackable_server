services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackable}
      POSTGRES_DB: ${POSTGRES_DB:-trackable}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackable}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["api"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: ["beat"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: a small HTTP server with elements that change on a schedule,
  # useful for testing your watcher end-to-end without depending on a real
  # website. Point a trackable's url at http://test-page:8080 from inside the
  # other containers, or http://localhost:8080 from your host machine.
  test-page:
    build:
      context: .
      dockerfile: Dockerfile.testserver
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data: