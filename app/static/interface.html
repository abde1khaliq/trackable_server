<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI Starter Toolkit</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      text-align: center;
      padding: 4rem 2rem;
      background: #0070f3;
      color: white;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .card {
      padding: 1.5rem;
      border: 1px solid #eaeaea;
      border-radius: 10px;
      text-align: left;
      transition: box-shadow 0.2s ease;
      background: white;
    }
    .card:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .card h2 {
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
      color: #0070f3;
    }
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid #eaeaea;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to FastAPI Starter Toolkit</h1>
    <p>Kickstart your FastAPI + Postgres + JWT application</p>
  </header>
  <main>
    <div class="grid">
      <a href="/docs" class="card">
        <h2>Swagger UI →</h2>
        <p>Interactive API documentation powered by Swagger.</p>
      </a>
      <a href="/redoc" class="card">
        <h2>ReDoc →</h2>
        <p>Alternative API documentation powered by ReDoc.</p>
      </a>
    </div>
  </main>
  <footer>
    <p>Powered by FastAPI • Postgres • JWT</p>
  </footer>
</body>
</html>
